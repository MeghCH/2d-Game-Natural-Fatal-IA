name: Build & Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Installer Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Build et tests
        run: ./mvnw -B verify

      - name: Rapports de tests
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v5
        with:
          name: rapports-tests
          path: target/surefire-reports/
          retention-days: 3
